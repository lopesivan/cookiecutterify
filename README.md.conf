# cookiecutter-__PLATAFORM__-__TEMPLATE_MODEL__-__LANGUAGE__

[cookiecutter](https://github.com/lopesivan/cookiecutter-__PLATAFORM__-__TEMPLATE_MODEL__-__LANGUAGE__) template for __PLATAFORM__ __TEMPLATE_MODEL__ using __LANGUAGE__.

## Requirements

- [cookiecutter](https://github.com/cookiecutter/cookiecutter)

## Usage

```
    local test:
    PYENV_VERSION=3.12.6 cookiecutter .

    remote test:
	PYENV_VERSION=3.12.6 cookiecutter gh:lopesivan/cookiecutter-__PLATAFORM__-__TEMPLATE_MODEL__-__LANGUAGE__
```


O **Game Activity C++** é o template moderno do Google para desenvolvimento de jogos e apps C++ no Android, substituto oficial do `NativeActivity`.

---

**O que é:**

`GameActivity` é uma biblioteca Jetpack projetada para auxiliar jogos Android no processamento de comandos do ciclo de vida do app, eventos de input e texto na camada C/C++. É descendente direto do `NativeActivity` com arquitetura similar.

---

**Diferenças em relação ao Native C++ clássico (`NativeActivity`):**


- Renderiza em `SurfaceView`, facilitando a interação com outros componentes de UI
- Tem implementação completamente nova para eventos de toque e teclado via interface `android_input_buffer`
- É derivado de `AppCompatActivity`, permitindo uso de outros componentes Jetpack como `ActionBar` e `Fragment`
- Adiciona suporte a input de texto via biblioteca `GameTextInput`


---

**Estrutura do template gerado:**

```
app/
  src/
    main/
      cpp/
        main.cpp          ← ponto de entrada C++
        CMakeLists.txt
      java/
        MainActivity.kt   ← estende GameActivity
      AndroidManifest.xml
  build.gradle            ← inclui dependência games-activity
```

O ponto de entrada C++ é `android_main` em vez de `JNI_OnLoad`:

```cpp
void android_main(struct android_app* pApp) {
    // loop principal do jogo aqui
}

void handle_cmd(android_app* pApp, int32_t cmd) {
    // ciclo de vida: APP_CMD_INIT_WINDOW, APP_CMD_TERM_WINDOW, etc.
}
```

---

**Como é distribuído:**

O `GameActivity` é distribuído como um Android Archive (AAR) contendo a classe Java usada no `AndroidManifest.xml` e o código C/C++ que conecta o lado Java à implementação nativa. A partir da versão 1.2.2, uma biblioteca estática também é fornecida via formato Prefab.

---

**Por que usar em vez do Native C++ simples:**

O Google recomenda fortemente o uso do `GameActivity` para novos jogos e outras aplicações C++ intensivas. Para apps existentes com `NativeActivity`, a recomendação é migrar para `GameActivity`. O `NativeActivity` faz parte do framework Android e segue seu ciclo de release anual, enquanto o `GameActivity` faz parte do Jetpack com ciclo tipicamente quinzenal — novos recursos e correções chegam muito mais rápido.

---

**Em resumo — comparação rápida:**

| | Native C++ | Game Activity C++ |
|---|---|---|
| base | `NativeActivity` (framework) | `GameActivity` (Jetpack) |
| UI | sem Jetpack | AppCompat + Fragment |
| input | `InputQueue` | `android_input_buffer` |
| teclado soft | manual/complicado | `GameTextInput` nativo |
| updates | anual (Android) | quinzenal (Jetpack) |
| uso ideal | apps simples JNI | jogos, engines, rendering |

